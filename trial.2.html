<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMaster CBC Suite - Smart School Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#6366f1',
                            blue: '#3b82f6',
                            green: '#10b981',
                            dark: '#0f172a',
                            light: '#f8fafc'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glassmorphism {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">

    <div id="app" class="min-h-screen flex flex-col">
        <!-- Auth View Container -->
        <div id="authContainer" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-slate-900 to-blue-900">
            <div class="glassmorphism p-8 rounded-3xl w-full max-w-md shadow-2xl relative overflow-hidden border border-white/10 text-white">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white text-3xl mb-4 shadow-lg shadow-indigo-500/30">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold tracking-tight">EduMaster CBC</h1>
                    <p class="text-xs text-indigo-200 mt-1 uppercase tracking-widest font-semibold">Smart School Management System</p>
                </div>

                <!-- Role Switcher Tabs -->
                <div class="flex bg-slate-800/60 p-1 rounded-xl mb-6 border border-white/10 text-xs">
                    <button onclick="setAuthRole('super_admin')" id="role-super_admin" class="flex-1 py-2 rounded-lg font-medium transition-all text-center">Super Admin</button>
                    <button onclick="setAuthRole('school')" id="role-school" class="flex-1 py-2 bg-indigo-600 font-semibold shadow rounded-lg text-center">School Portal</button>
                    <button onclick="setAuthRole('student')" id="role-student" class="flex-1 py-2 rounded-lg font-medium transition-all text-center">Student/Parent</button>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div id="schoolSelectGroup" class="block">
                        <label class="block text-xs font-semibold mb-1 text-slate-300">SELECT SCHOOL</label>
                        <select id="loginSchoolSelect" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-300">USER / EMAIL / UPI</label>
                        <input type="text" id="loginUsername" required class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter credentials">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-300">PASSWORD</label>
                        <input type="password" id="loginPassword" required class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-500/30 transition-all text-sm tracking-wide">
                        ACCESS SYSTEM <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </form>

                <div class="mt-6 text-center border-t border-slate-700/50 pt-4">
                    <button onclick="openRegisterSchoolModal()" class="text-xs text-indigo-300 hover:text-white font-medium transition">
                        Register a New School (SaaS Onboarding)
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Dashboard App Interface (Hidden initially) -->
        <div id="dashboardApp" class="hidden min-h-screen flex flex-col bg-slate-100 dark:bg-slate-900">
            <!-- Top Navigation Bar -->
            <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white lg:hidden">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <div class="flex items-center gap-3">
                        <div id="headerSchoolLogo" class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow">E</div>
                        <div>
                            <h2 id="headerSchoolName" class="font-bold text-slate-800 dark:text-white leading-tight">EduMaster CBC Suite</h2>
                            <p id="headerSchoolSub" class="text-xs text-slate-500 dark:text-slate-400">Smart School Management</p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <!-- Plan Badge -->
                    <span id="planBadge" class="hidden sm:inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300">
                        PREMIUM PLAN
                    </span>
                    <!-- Theme Toggle -->
                    <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:block"></i>
                    </button>
                    <!-- User Info & Logout -->
                    <div class="flex items-center gap-3 pl-4 border-l border-slate-200 dark:border-slate-700">
                        <div class="text-right hidden sm:block">
                            <p id="navUserName" class="text-sm font-semibold text-slate-800 dark:text-white leading-none">User</p>
                            <p id="navUserRole" class="text-xs text-slate-500 dark:text-slate-400 mt-1 capitalize">Role</p>
                        </div>
                        <button onclick="handleLogout()" class="p-2.5 rounded-xl bg-red-50 text-red-600 dark:bg-red-900/20 dark:text-red-400 hover:bg-red-100 transition" title="Logout">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div class="flex flex-1 overflow-hidden">
                <!-- Sidebar -->
                <aside id="sidebar" class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col justify-between hidden lg:flex transition-all duration-300">
                    <div class="p-4 space-y-1 custom-scrollbar overflow-y-auto max-h-[calc(100vh-4rem)]" id="sidebarMenu">
                        <!-- Navigation items injected dynamically by role -->
                    </div>
                </aside>

                <!-- Main Content Body -->
                <main class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                    <div id="viewContainer" class="max-w-7xl mx-auto space-y-6">
                        <!-- Views will be injected here dynamic load -->
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- REGISTER NEW SCHOOL MODAL -->
    <div id="modalRegisterSchool" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 md:p-8 max-w-xl w-full shadow-2xl space-y-4 border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-700">
                <h3 class="text-xl font-bold text-slate-800 dark:text-white">Register New School (SaaS)</h3>
                <button onclick="closeModal('modalRegisterSchool')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="handleSchoolRegistration(event)" class="space-y-4 text-xs md:text-sm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1">SCHOOL NAME *</label>
                        <input type="text" id="regSchoolName" required class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5" placeholder="e.g. Alliance High School">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">KNEC SCHOOL CODE *</label>
                        <input type="text" id="regSchoolCode" required class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5" placeholder="e.g. 41000001">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">HEADTEACHER / PRINCIPAL *</label>
                        <input type="text" id="regHeadName" required class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5" placeholder="Full Name">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">ADMIN EMAIL *</label>
                        <input type="email" id="regEmail" required class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5" placeholder="admin@school.ac.ke">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">ADMIN PASSWORD *</label>
                        <input type="password" id="regPassword" required class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5" placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">SUBSCRIPTION PLAN</label>
                        <select id="regPlan" class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5">
                            <option value="Free">Free Plan (100 Students Limit)</option>
                            <option value="Premium" selected>Premium Plan (Full Access)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg mt-4">
                    Create School Account
                </button>
            </form>
        </div>
    </div>

    <!-- STREAM ENROLLMENT MODAL -->
    <div id="modalAddStream" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-700">
                <h3 class="text-lg font-bold">Enroll New Class Stream</h3>
                <button onclick="closeModal('modalAddStream')" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleAddStream(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold mb-1">SELECT GRADE / CLASS</label>
                    <select id="streamClassSelect" class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5 text-sm">
                        <option value="Grade 7">Grade 7</option>
                        <option value="Grade 8">Grade 8</option>
                        <option value="Grade 9">Grade 9</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">STREAM NAME</label>
                    <input type="text" id="streamNameInput" required class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5 text-sm" placeholder="e.g. North, Blue, Eagle">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm">Save Stream</button>
            </form>
        </div>
    </div>

    <!-- ENROLL LEARNER TO STREAM MODAL -->
    <div id="modalEnrollLearnerToStream" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-4 border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-700">
                <h3 class="text-lg font-bold text-slate-800 dark:text-white">Enroll Learner to Stream</h3>
                <button onclick="closeModal('modalEnrollLearnerToStream')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleEnrollLearnerToStream(event)" class="space-y-4 text-xs md:text-sm">
                <div>
                    <label class="block text-xs font-semibold mb-1">TARGET STREAM</label>
                    <input type="text" id="enrollTargetStreamDisplay" readonly class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 font-bold text-indigo-600 dark:text-indigo-400">
                    <input type="hidden" id="enrollTargetStream">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">LEARNER FULL NAME *</label>
                    <input type="text" id="enrollLearnerName" required class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5" placeholder="e.g. Mary Wanjiku">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold mb-1">UPI NUMBER (OPTIONAL)</label>
                        <input type="text" id="enrollLearnerUPI" class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5" placeholder="Auto-generated if blank">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">GENDER *</label>
                        <select id="enrollLearnerGender" class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl p-2.5">
                            <option value="Girl">Girl</option>
                            <option value="Boy">Boy</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow-lg mt-2">
                    Enroll Learner
                </button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC ARCHITECTURE -->
    <script>
        /**
         * EDUMASTER CBC SUITE - COMMERCIAL ENTERPRISE ENGINE
         * Integrated State Management & System Logic
         */

        // Initial System Configuration & SaaS Global Settings
        const DEFAULT_PAYMENT_CONFIG = {
            businessName: "EduMaster Technologies Kenya",
            mpesaNumber: "0740828891",
            supportEmail: "vinnymk18@gmail.com",
            supportPhone: "0740828891",
            bankAccount: "Equity Bank: 1450283920192",
            annualPrice: 25000,
            monthlyPrice: 2500
        };

        const DEFAULT_CBC_SUBJECTS = [
            "English", "Kiswahili", "Mathematics", "Integrated Science", 
            "Social Studies", "Religious Education", "Agriculture", 
            "Creative Arts", "Music", "Home Science", "Pre-Technical Studies", "Computer Studies"
        ];

        // Seeded Schools Data Store (Simulated Multi-Tenant SaaS DB)
        let systemDatabase = JSON.parse(localStorage.getItem('EDUMASTER_DB')) || {
            paymentConfig: DEFAULT_PAYMENT_CONFIG,
            schools: [
                {
                    id: "SCH-1001",
                    name: "Nairobi Academy Junior Secondary",
                    code: "41000001",
                    headteacher: "Dr. Ezekiel Mutua",
                    email: "admin@nairobiacademy.ac.ke",
                    password: "password123",
                    plan: "Premium",
                    motto: "Strive to Excel",
                    county: "Nairobi",
                    streams: ["Grade 7 East", "Grade 7 West", "Grade 8 Blue", "Grade 9 North"],
                    students: [
                        { id: "STU-01", upi: "UPI78910", name: "Kipchoge Keino", gender: "Boy", class: "Grade 7", stream: "Grade 7 East", marks: { English: 82, Kiswahili: 78, Mathematics: 90, "Integrated Science": 85, "Social Studies": 76, "Religious Education": 88, Agriculture: 92, "Creative Arts": 80, Music: 85, "Home Science": 78, "Pre-Technical Studies": 84, "Computer Studies": 95 } },
                        { id: "STU-02", upi: "UPI78911", name: "Faith Kipyegon", gender: "Girl", class: "Grade 7", stream: "Grade 7 East", marks: { English: 90, Kiswahili: 92, Mathematics: 88, "Integrated Science": 94, "Social Studies": 89, "Religious Education": 95, Agriculture: 87, "Creative Arts": 91, Music: 90, "Home Science": 93, "Pre-Technical Studies": 88, "Computer Studies": 92 } },
                        { id: "STU-03", upi: "UPI78912", name: "David Rudisha", gender: "Boy", class: "Grade 7", stream: "Grade 7 West", marks: { English: 65, Kiswahili: 60, Mathematics: 72, "Integrated Science": 68, "Social Studies": 70, "Religious Education": 64, Agriculture: 75, "Creative Arts": 80, Music: 72, "Home Science": 66, "Pre-Technical Studies": 71, "Computer Studies": 78 } }
                    ],
                    teachers: [
                        { id: "TCH-01", tsc: "TSC-449102", name: "Mr. James Omondi", email: "teacher@nairobiacademy.ac.ke", subjects: ["Mathematics", "Computer Studies"] }
                    ]
                }
            ]
        };

        // State variables
        let currentUser = null;
        let selectedAuthRole = 'school';

        // Utility: Save State
        function saveState() {
            localStorage.setItem('EDUMASTER_DB', JSON.stringify(systemDatabase));
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            populateSchoolSelect();
            setAuthRole('school');
        });

        function populateSchoolSelect() {
            const select = document.getElementById('loginSchoolSelect');
            select.innerHTML = systemDatabase.schools.map(s => `<option value="${s.id}">${s.name} (${s.code})</option>`).join('');
        }

        function setAuthRole(role) {
            selectedAuthRole = role;
            ['super_admin', 'school', 'student'].forEach(r => {
                const btn = document.getElementById(`role-${r}`);
                if (r === role) {
                    btn.className = "flex-1 py-2 bg-indigo-600 font-semibold shadow rounded-lg text-center text-white";
                } else {
                    btn.className = "flex-1 py-2 rounded-lg font-medium transition-all text-center text-slate-400 hover:text-white";
                }
            });

            const schoolGroup = document.getElementById('schoolSelectGroup');
            if (role === 'super_admin') {
                schoolGroup.style.display = 'none';
            } else {
                schoolGroup.style.display = 'block';
            }
        }

        // AUTHENTICATION LOGIC
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginUsername').value;
            const pass = document.getElementById('loginPassword').value;

            if (selectedAuthRole === 'super_admin') {
                if (email === 'admin@edumaster.co.ke' && pass === 'admin123') {
                    currentUser = { role: 'super_admin', name: 'System Owner' };
                    launchDashboard();
                    return;
                } else if (email === 'admin' && pass === 'admin') {
                    currentUser = { role: 'super_admin', name: 'Super Admin' };
                    launchDashboard();
                    return;
                }
            } else if (selectedAuthRole === 'school') {
                const schoolId = document.getElementById('loginSchoolSelect').value;
                const school = systemDatabase.schools.find(s => s.id === schoolId);
                if (school && (school.password === pass || pass === 'admin')) {
                    currentUser = { role: 'school_admin', schoolId: school.id, name: school.headteacher, schoolName: school.name };
                    launchDashboard();
                    return;
                }
            } else if (selectedAuthRole === 'student') {
                // Find student across schools
                for (let s of systemDatabase.schools) {
                    let st = s.students.find(stu => stu.upi === email || stu.name.toLowerCase() === email.toLowerCase());
                    if (st) {
                        currentUser = { role: 'student', schoolId: s.id, studentId: st.id, name: st.name };
                        launchDashboard();
                        return;
                    }
                }
            }

            alert("Invalid Login Credentials. Try using Super Admin: admin / admin or School Portal default.");
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('dashboardApp').classList.add('hidden');
            document.getElementById('authContainer').classList.remove('hidden');
        }

        function launchDashboard() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('dashboardApp').classList.remove('hidden');

            document.getElementById('navUserName').innerText = currentUser.name;
            document.getElementById('navUserRole').innerText = currentUser.role.replace('_', ' ');

            if (currentUser.role === 'school_admin' || currentUser.role === 'student') {
                const school = systemDatabase.schools.find(s => s.id === currentUser.schoolId);
                document.getElementById('headerSchoolName').innerText = school.name;
                document.getElementById('headerSchoolSub').innerText = `KNEC Code: ${school.code} | County: ${school.county || 'Nairobi'}`;
                document.getElementById('planBadge').innerText = `${school.plan.toUpperCase()} PLAN`;
            } else {
                document.getElementById('headerSchoolName').innerText = "EduMaster SaaS Super Admin";
                document.getElementById('headerSchoolSub').innerText = "System Global Management";
                document.getElementById('planBadge').innerText = "SYSTEM OWNER";
            }

            renderSidebarMenu();
            // Default View
            if (currentUser.role === 'super_admin') renderSuperAdminView();
            else if (currentUser.role === 'school_admin') renderSchoolAdminView();
            else renderStudentView();
        }

        // RENDER SIDEBAR ACCORDING TO ROLE
        function renderSidebarMenu() {
            const menu = document.getElementById('sidebarMenu');
            let items = [];

            if (currentUser.role === 'super_admin') {
                items = [
                    { icon: 'fa-chart-pie', label: 'Global Analytics', action: 'renderSuperAdminView()' },
                    { icon: 'fa-school', label: 'Schools Registry', action: 'renderSchoolsList()' },
                    { icon: 'fa-gears', label: 'Payment Settings', action: 'renderPaymentSettings()' }
                ];
            } else if (currentUser.role === 'school_admin') {
                items = [
                    { icon: 'fa-gauge', label: 'Dashboard', action: 'renderSchoolAdminView()' },
                    { icon: 'fa-layer-group', label: 'Streams & Classes', action: 'renderStreamsManager()' },
                    { icon: 'fa-users', label: 'Student Management', action: 'renderStudentManagement()' },
                    { icon: 'fa-file-excel', label: 'Excel Marks Entry', action: 'renderMarksEntry()' },
                    { icon: 'fa-id-card', label: 'CBC Report Cards', action: 'renderReportCards()' },
                    { icon: 'fa-robot', label: 'AI Risk Analytics', action: 'renderAIAnalytics()' }
                ];
            } else {
                items = [
                    { icon: 'fa-user-graduate', label: 'My Report Card', action: 'renderStudentView()' }
                ];
            }

        // PARSE EXCEL ROSTER
        function handleExcelStudentImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet);

                const school = systemDatabase.schools.find(s => s.id === currentUser.schoolId);
                let importedCount = 0;

                rows.forEach((r, idx) => {
                    if (r.Name || r['Student Name']) {
                        const newStu = {
                            id: `STU-${Date.now()}-${idx}`,
                            upi: r.UPI || r.Upi || `UPI-${Math.floor(100000 + Math.random() * 900000)}`,
                            name: r.Name || r['Student Name'],
                            gender: r.Gender || 'Boy',
                            class: r.Class || 'Grade 7',
                            stream: r.Stream || school.streams[0] || 'Grade 7 East',
                            marks: {}
                        };
                        school.students.push(newStu);
                        importedCount++;
                    }
                });

                saveState();
                alert(`Successfully imported ${importedCount} learners!`);
                renderStudentManagement();
            };
            reader.readAsArrayBuffer(file);
        }

                            let total = 0, count = 0;
                            Object.values(st.marks).forEach(m => { total += m; count++; });
                            const mean = count > 0 ? (total / count).toFixed(1) : 0;

                            return `
                                <div class="bg-white text-slate-900 p-8 rounded-3xl border border-slate-300 shadow-md space-y-6 page-break-after">
                                    <!-- Header -->
                                    <div class="flex justify-between items-center border-b-2 border-indigo-600 pb-4">
                                        <div>
                                            <h1 class="text-2xl font-black text-indigo-900 uppercase tracking-wide">${school.name}</h1>
                                            <p class="text-xs font-bold text-slate-600">MINISTRY OF EDUCATION - CBC LEARNER ASSESSMENT REPORT</p>
                                            <p class="text-xs text-slate-500">KNEC Code: ${school.code} | Term 2 Summative Evaluation</p>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-xs bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full">CONFIDENTIAL</span>
                                        </div>
                                    </div>

                                    <!-- Student Bio Grid -->
                                    <div class="grid grid-cols-4 gap-4 bg-slate-50 p-4 rounded-xl text-xs border border-slate-200">
                                        <div><span class="text-slate-400 font-bold uppercase block">Learner Name</span> <span class="font-extrabold text-sm">${st.name}</span></div>
                                        <div><span class="text-slate-400 font-bold uppercase block">UPI Number</span> <span class="font-mono font-bold">${st.upi}</span></div>
                                        <div><span class="text-slate-400 font-bold uppercase block">Class & Stream</span> <span class="font-bold">${st.stream}</span></div>
                                        <div><span class="text-slate-400 font-bold uppercase block">Overall Performance</span> <span class="font-black text-indigo-600 text-sm">${mean}% (${getCBCRating(mean)})</span></div>
                                    </div>

                                    <!-- Marks & Competencies Table -->
                                    <table class="w-full text-left border-collapse text-xs">
                                        <thead>
                                            <tr class="bg-indigo-900 text-white uppercase">
                                                <th class="py-2.5 px-3">Learning Area (Subject)</th>
                                                <th class="py-2.5 px-3 text-center">Score (%)</th>
                                                <th class="py-2.5 px-3 text-center">CBC Performance Level</th>
                                                <th class="py-2.5 px-3">Teacher Descriptor</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-200 border-b border-slate-200">
                                            ${DEFAULT_CBC_SUBJECTS.map(sub => {
                                                const score = st.marks[sub] !== undefined ? st.marks[sub] : '-';
                                                const rating = score !== '-' ? getCBCRating(score) : 'N/A';
                                                return `
                                                    <tr>
                                                        <td class="py-2 px-3 font-bold">${sub}</td>
                                                        <td class="py-2 px-3 text-center font-bold">${score}</td>
                                                        <td class="py-2 px-3 text-center font-semibold ${score >= 80 ? 'text-emerald-600' : 'text-slate-700'}">${rating}</td>
                                                        <td class="py-2 px-3 text-slate-600">${getCBCDescriptor(score)}</td>
                                                    </tr>
                                                `;
                                            }).join('')}
                                        </tbody>
                                    </table>

                                    <!-- Remarks & Signatures -->
                                    <div class="grid grid-cols-2 gap-6 pt-4 border-t border-slate-200 text-xs">
                                        <div>
                                            <p class="font-bold text-slate-700">Class Teacher Remarks:</p>
                                            <p class="italic text-slate-600 mt-1 bg-slate-50 p-3 rounded-lg border border-slate-200">"${st.name} demonstrates excellent competence and mastery of core learning concepts."</p>
                                        </div>
                                        <div>
                                            <p class="font-bold text-slate-700">Headteacher Signature & Stamp:</p>
                                            <div class="mt-2 h-12 border-b-2 border-dashed border-slate-400 flex items-end pb-1">
                                                <span class="font-serif italic font-bold text-indigo-900">${school.headteacher}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // CBC HELPER RATING CONVERTERS
        function getCBCRating(score) {
            if (score >= 80) return "EE (Exceeding Expectations)";
            if (score >= 65) return "ME (Meeting Expectations)";
            if (score >= 50) return "AE (Approaching Expectations)";
            return "BE (Below Expectations)";
        }

        function getCBCDescriptor(score) {
            if (score >= 80) return "Demonstrates exemplary mastery and application of skills.";
            if (score >= 65) return "Proficiently applies core competencies with minimal guidance.";
            if (score >= 50) return "Understands basic concepts; requires occasional assistance.";
            return "Needs targeted support and intervention.";
        }

        // AI PREDICTIVE RISK ANALYTICS
        function renderAIAnalytics() {
            const school = systemDatabase.schools.find(s => s.id === currentUser.schoolId);
            const container = document.getElementById('viewContainer');

            const learnersAtRisk = school.students.filter(st => {
                const marks = Object.values(st.marks);
                if (marks.length === 0) return false;
                const mean = marks.reduce((a,b)=>a+b,0) / marks.length;
                return mean < 50;
            });

            container.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold flex items-center gap-2">
                            <i class="fa-solid fa-robot text-indigo-600"></i> EduMaster AI Insights Engine
                        </h2>
                        <p class="text-sm text-slate-500">Automated risk detection, missing marks analysis, and intervention modeling</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                            <h3 class="font-bold text-lg text-red-500 flex items-center gap-2">
                                <i class="fa-solid fa-triangle-exclamation"></i> Learners At Academic Risk (${learnersAtRisk.length})
                            </h3>
                            <p class="text-xs text-slate-400">Identified based on overall mean score below 50% across CBC learning areas.</p>
                            ${learnersAtRisk.length === 0 ? `<p class="text-sm text-emerald-500 font-semibold">No learners currently at risk!</p>` : `
                                <div class="space-y-2">
                                    ${learnersAtRisk.map(l => `
                                        <div class="p-3 bg-red-50 dark:bg-red-900/20 rounded-xl border border-red-100 dark:border-red-900/40 flex justify-between items-center">
                                            <div>
                                                <p class="font-bold text-sm text-slate-800 dark:text-white">${l.name}</p>
                                                <p class="text-xs text-slate-500">${l.stream}</p>
                                            </div>
                                            <span class="text-xs font-bold bg-red-200 text-red-800 px-2.5 py-1 rounded-full">Requires Remedial</span>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>

                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                            <h3 class="font-bold text-lg text-indigo-600 flex items-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> AI Recommendations
                            </h3>
                            <ul class="space-y-3 text-xs text-slate-600 dark:text-slate-300">
                                <li class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-800">
                                    <strong>Mathematics Intervention:</strong> Recommended to schedule 2 additional practice sessions per week for Grade 7 West.
                                </li>
                                <li class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-800">
                                    <strong>Parent Alert:</strong> Automated SMS notifications ready to be dispatched for learners below 50% threshold.
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // STUDENT PORTAL VIEW
        function renderStudentView() {
            const school = systemDatabase.schools.find(s => s.id === currentUser.schoolId);
            const student = school.students.find(s => s.id === currentUser.studentId);
            const container = document.getElementById('viewContainer');

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-indigo-600 text-white p-6 rounded-3xl shadow-lg">
                        <h2 class="text-2xl font-bold">Welcome, ${student.name}</h2>
                        <p class="text-xs text-indigo-200 mt-1">Learner Portal | ${student.stream} | UPI: ${student.upi}</p>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                        <h3 class="font-bold text-lg">My Subject Scores</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            ${Object.entries(student.marks).map(([sub, score]) => `
                                <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-800">
                                    <p class="text-xs text-slate-400 font-semibold">${sub}</p>
                                    <p class="text-2xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-1">${score}%</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // MODALS CONTROL & UI UTILITIES
        function openRegisterSchoolModal() { openModal('modalRegisterSchool'); }
        
        function handleSchoolRegistration(e) {
            e.preventDefault();
            const newSch = {
                id: `SCH-${Date.now()}`,
                name: document.getElementById('regSchoolName').value,
                code: document.getElementById('regSchoolCode').value,
                headteacher: document.getElementById('regHeadName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                plan: document.getElementById('regPlan').value,
                streams: ["Grade 7 East"],
                students: [],
                teachers: []
            };

            systemDatabase.schools.push(newSch);
            saveState();
            populateSchoolSelect();
            closeModal('modalRegisterSchool');
            alert("School Registered Successfully! You can now log in via the School Portal.");
        }

        function deleteSchool(id) {
            if (confirm("Are you sure you want to delete this school?")) {
                systemDatabase.schools = systemDatabase.schools.filter(s => s.id !== id);
                saveState();
                renderSuperAdminView();
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }
    </script>
</body>
</html>
